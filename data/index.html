<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cryocooler Control Panel</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>❄️</text></svg>" />
    <style>
      body{margin:0;background:#eef2f7;font-family:"Inter","Roboto","Helvetica","Arial",sans-serif}
      .sk{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px}
      .sk-spin{width:52px;height:52px;border:3.5px solid #e0e0e0;border-top-color:#0277bd;border-radius:50%;animation:r 1s linear infinite}
      @keyframes r{to{transform:rotate(360deg)}}
      .sk h2{color:#546e7a;font-weight:500;font-size:1.25rem;margin:0}
      .sk p{color:#90a4ae;font-size:0.75rem;margin:0}
    </style>
    <script type="module" crossorigin src="/app.js"></script>
  </head>
  <body>
    <div id="app">
      <div class="sk">
        <div class="sk-spin"></div>
        <h2>Loading Dashboard</h2>
        <p>Connecting to device…</p>
      </div>
    </div>
  </body>
</html>
