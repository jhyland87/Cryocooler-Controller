syntax = "proto3";
package cryocooler;

// Single telemetry frame pushed at 1 Hz over WebSocket.
// Each sub-message corresponds to a dot-notation prefix in the flat JSON.
// Field numbers must never be renumbered after deployment to maintain
// wire compatibility.

message TelemetryFrame {
  Timestamp    timestamp   = 1;
  State        state       = 2;
  Status       status      = 3;
  ColdHead     cold_head   = 4;
  Amplifier    amplifier   = 5;
  SystemInfo   system      = 6;
  Imu          imu         = 7;
  Cooling      cooling     = 8;
  Compressor   compressor  = 9;
  Relay        relay       = 10;
  Indicator    indicator   = 11;
  Faults       faults      = 12;
  Firmware     firmware    = 13;
  Scores       score       = 14;
  ModuleStatus modules     = 15;
  int64        log_epoch   = 16;  // epoch of most recent log entry (0 = none)
}

message Timestamp {
  int64  epoch = 1;   // Unix seconds (UTC)
  string local = 2;   // "YYYY-MM-DD HH:MM:SS"
}

message State {
  sint32 id          = 1;  // sint32: state.id can be -1
  string name        = 2;
  string status_text = 3;
}

message Status {
  uint32 on_duration_ms = 1;
  string on_duration    = 2;  // HH:MM:SS
  string time_in_state  = 3;  // HH:MM:SS
  uint32 backoff_count  = 4;
}

message ColdHead {
  float temp_c                = 1;
  float cooling_rate          = 2;
  float cooldown_pct          = 3;
  float delta_below_ambient_c = 4;
  float ambient_temp_c        = 5;
  float voltage_v             = 6;
  float current_a             = 7;
  bool  has_temp              = 8;  // false when sensor fault (temp_c is invalid)
  float target_temp_c         = 9;  // current setpoint the system is aiming for
}

message Amplifier {
  float voltage_v = 1;
  float current_a = 2;
  float power_w   = 3;
}

message SystemInfo {
  float  voltage_v          = 1;
  float  current_a          = 2;
  float  power_w            = 3;
  float  cpu_usage_percent  = 4;
  uint32 cpu_freq_mhz       = 5;
  float  heap_usage_percent = 6;
  float  psram_usage_percent = 7;
  uint32 total_heap_bytes   = 8;
  uint32 total_psram_bytes  = 9;
  uint32 uptime_ms          = 10;
  uint32 num_cores          = 11;
}

message Imu {
  float  roll_deg  = 1;
  float  pitch_deg = 2;
  float  yaw_deg   = 3;
  float  accel_mag = 4;
  float  temp_c    = 5;
  uint32 motion    = 6;
  float  x         = 7;
  float  y         = 8;
  float  z         = 9;
  float  freq_hz   = 10;  // Z-axis vibration frequency from FFT (Hz), 0 = no signal
}

message Cooling {
  int32  status        = 1;
  int32  pump_on       = 2;
  float  temp_c        = 3;
  float  flow_rate_lpm = 4;
  float  fan_speed     = 5;
  uint32 fan_rpm       = 6;
  float  pump_speed    = 7;
  uint32 pump_rpm      = 8;
}

message Compressor {
  int32 status = 1;
}

message Relay {
  int32 compressor_state = 1;
  int32 amplifier_state  = 2;
}

message Indicator {
  int32 fault = 1;
  int32 ready = 2;
}

message Faults {
  uint32 count_10m = 1;
  uint32 count_30m = 2;
  uint32 count_60m = 3;
}

message Firmware {
  string version         = 1;
  string build_date      = 2;
  int64  ota_flash_ts    = 3;
  string ota_flash_local = 4;
}

message ScoreCooling {
  float fan_speed    = 1;
  float coolant_temp = 2;
  float coolant_flow = 3;
  float worst        = 4;
}

message Scores {
  ScoreCooling cooling = 1;
}

message ModuleEntry {
  string init    = 1;
  string service = 2;
}

message ModuleStatus {
  ModuleEntry hardware      = 1;
  ModuleEntry sysinfo       = 2;
  ModuleEntry imu           = 3;
  ModuleEntry cooling       = 4;
  ModuleEntry dashboard     = 5;
  ModuleEntry cold_head     = 6;
  ModuleEntry indicator     = 7;
  ModuleEntry state_machine = 8;
  ModuleEntry commands      = 9;
  ModuleEntry telemetry     = 10;
}

// ── Run history (GET /api/history) ──────────────────────────────────────────
// Not part of TelemetryFrame. The response body is one length-delimited
// RunHistoryHeader followed by length-delimited HistorySample messages,
// oldest first. Samples come from the PSRAM run recorder at 1 Hz.

message RunHistoryHeader {
  uint32          boot_id   = 1;  // random per boot; a change means the device restarted
  repeated string channels  = 2;  // telemetry keys, in HistorySample.values order
  uint32          first_seq = 3;  // seq of the first sample in this response
  uint32          end_seq   = 4;  // one past the newest seq in this response
}

message HistorySample {
  uint32         seq       = 1;  // sample number since boot
  uint32         uptime_ms = 2;  // device uptime when sampled
  sint32         state_id  = 3;  // FSM state id (sint32: Off is -1)
  repeated float values    = 4;  // one per RunHistoryHeader.channels; NaN = no valid reading
}
