; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1-n32r16v
framework = arduino
lib_deps =
	adafruit/Adafruit MAX31865 library@^1.6.2
	majicdesigns/MD_AD9833@^1.3.0
	milesburton/DallasTemperature@^4.0.6
	bblanchon/ArduinoJson@^7.4.2
	; QMI8658 is vendored in lib/QMI8658 (patched to not call Wire.begin()
	; internally — see lib/QMI8658/src/QMI8658.cpp for rationale).
	lahavg/QMI8658@^1.0.1
	mathieucarbou/ESPAsyncWebServer@^3.6.0
	robtillaart/RunningAverage@^0.4.7
board_build.filesystem = littlefs
extra_scripts = pre:scripts/embed_web.py
lib_ignore =
	ESPAsyncTCP
	RPAsyncTCP
	AsyncTCP_RP2040W
test_framework = unity
test_filter = test_embedded
monitor_speed = 115200
upload_speed = 921600
build_flags =
	-DCORE_DEBUG_LEVEL=3
	-O2
	-I include

[env:native]
build_flags =
	-DUNITY_INCLUDE_CONFIG_H
platform = native
test_filter = test_native
build_src_filter = +<stub.cpp> +<state_machine.cpp> +<commands.cpp> +<serial_commands.cpp> +<telemetry.cpp> +<frame_builder.cpp> -<*>
lib_deps =
	milesburton/DallasTemperature@^4.0.6
	bblanchon/ArduinoJson@^7.4.2
	lahavg/QMI8658@^1.0.1
