; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = espressif32@5.3.0
board = esp32-s3-devkitc-1-n32r16v
framework = arduino
lib_deps =
	adafruit/Adafruit MAX31865 library@^1.6.2
	majicdesigns/MD_AD9833@^1.3.0
	milesburton/DallasTemperature@^4.0.6
	bblanchon/ArduinoJson@^7.4.2
	mathieucarbou/ESPAsyncWebServer@^3.6.0
	robtillaart/RunningAverage@^0.4.7
	jonblack/arduino-fsm@^2.2.0
	adafruit/Adafruit INA260 Library@^1.5.3
	pololu/ACS37800@^1.0.0
	kosme/arduinoFFT@^2.0.4
	lahavg/QMI8658@^1.0.1
	adafruit/Adafruit EMC2101@^1.0.7
board_build.filesystem = littlefs
extra_scripts = pre:scripts/embed_web.py
lib_ignore =
	ESPAsyncTCP
	RPAsyncTCP
	AsyncTCP_RP2040W
test_framework = unity
test_filter = test_embedded
monitor_speed = 115200
upload_speed = 921600
build_unflags =
	-std=gnu++11
build_flags =
	-DCORE_DEBUG_LEVEL=4
	-O2
	-I include
	-std=gnu++17

[env:native]
build_flags =
	-DUNITY_INCLUDE_CONFIG_H
	-I test/test_native/stubs
platform = native
test_filter = test_native
lib_compat_mode = off
lib_deps =
	bblanchon/ArduinoJson@^7.4.2
	pololu/ACS37800@^1.0.0
	kosme/arduinoFFT@^2.0.4
	jonblack/arduino-fsm@^2.2.0
	adafruit/Adafruit EMC2101@^1.0.7
