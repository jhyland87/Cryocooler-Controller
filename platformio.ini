; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = espressif32@5.3.0
board = esp32-s3-devkitc-1-n32r16v
check_skip_packages = yes
framework = arduino
lib_deps =
	adafruit/Adafruit MAX31865 library@^1.6.2
	majicdesigns/MD_AD9833@^1.3.0
	bblanchon/ArduinoJson@^7.4.2
	mathieucarbou/ESPAsyncWebServer@^3.6.0
	robtillaart/RunningAverage@^0.4.7
	jonblack/arduino-fsm@^2.2.0
	adafruit/Adafruit INA237 and INA238 Library
	pololu/ACS37800@^1.0.0
	kosme/arduinoFFT@^2.0.4
	lahavg/QMI8658@^1.0.1
	adafruit/Adafruit EMC2101@^1.0.7
	adafruit/Adafruit MCP4725@^2.0.2
	sparkfun/SparkFun Qwiic Relay Arduino Library@^1.3.1
	; PCAL9535A vendored in lib/PCAL9535A — mWire.begin() removed (see lib/PCAL9535A/src/PCAL9535A.h)
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
extra_scripts =
	pre:scripts/build_dashboard.py
	pre:scripts/embed_web.py
lib_ignore =
	ESPAsyncTCP
	RPAsyncTCP
	AsyncTCP_RP2040W
test_framework = unity
test_filter = test_embedded
monitor_speed = 115200
; macOS exposes two device nodes for every USB serial port:
;   /dev/tty.* — DCE/modem side; RX is gated by hardware modem signals (DCD).
;                TX works but bytes sent TO the device are silently dropped.
;   /dev/cu.*  — DTE/call-out side; opens immediately, full bidirectional I/O.
; Always use cu.* for serial communication on macOS.
monitor_port = /dev/cu.usbmodem11101
upload_speed = 921600
build_unflags =
	-std=gnu++11
build_flags =
	-DCORE_DEBUG_LEVEL=1
	-O2
	-I include
	-std=gnu++17

[env:native]
build_flags =
	-DUNITY_INCLUDE_CONFIG_H
	-I test/test_native/stubs
platform = native
test_filter = test_native
lib_compat_mode = off
lib_deps =
	bblanchon/ArduinoJson@^7.4.2
	pololu/ACS37800@^1.0.0
	kosme/arduinoFFT@^2.0.4
	jonblack/arduino-fsm@^2.2.0
	adafruit/Adafruit EMC2101@^1.0.7
	adafruit/Adafruit MCP4725@^2.0.2
	sparkfun/SparkFun Qwiic Relay Arduino Library@^1.3.1
	; PCAL9535A vendored in lib/PCAL9535A — mWire.begin() removed
