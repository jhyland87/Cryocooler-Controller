; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32s3

[env:esp32s3]
; pioarduino 55.3.37 = Arduino ESP32 Core 3.3.7 + IDF 5.5.2.
; Pinned by URL so all environments (CI, other devs) get exactly the same
; toolchain.  To upgrade: replace the tag in both the URL and the comment.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-s3-devkitc-1-n32r16v
framework = arduino
lib_deps = 
	adafruit/Adafruit MAX31865 library@^1.6.2
	majicdesigns/MD_AD9833@^1.3.0
	milesburton/DallasTemperature@^4.0.6
	bblanchon/ArduinoJson@^7.4.2
	mathieucarbou/ESPAsyncWebServer@^3.6.0
	robtillaart/RunningAverage@^0.4.7
	jonblack/arduino-fsm@^2.2.0
	adafruit/Adafruit INA260 Library@^1.5.3
	pololu/ACS37800@^1.0.0
	kosme/arduinoFFT@^2.0.4
board_build.filesystem = littlefs
extra_scripts = pre:scripts/embed_web.py
lib_ignore = 
	ESPAsyncTCP
	RPAsyncTCP
	AsyncTCP_RP2040W
test_framework = unity
test_filter = test_embedded
monitor_speed = 115200
upload_speed = 921600
build_unflags = 
	-std=gnu++11
build_flags = 
	-DCORE_DEBUG_LEVEL=1
	-O2
	-I include
	-std=gnu++17

[env:native]
build_flags = 
	-DUNITY_INCLUDE_CONFIG_H
	-I test/test_native/stubs
	-I lib/arduino-fsm
platform = native
test_filter = test_native
lib_compat_mode = off
lib_deps = 
	bblanchon/ArduinoJson@^7.4.2
	pololu/ACS37800@^1.0.0
	kosme/arduinoFFT@^2.0.4
