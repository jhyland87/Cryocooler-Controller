; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = espressif32@5.3.0
board = esp32-s3-devkitc-1-n32r16v
check_skip_packages = yes
framework = arduino
lib_deps =
	majicdesigns/MD_AD9833@^1.3.0
	bblanchon/ArduinoJson@^7.4.2
	mathieucarbou/ESPAsyncWebServer@^3.6.0
	robtillaart/RunningAverage@^0.4.7
	jonblack/arduino-fsm@^2.2.0
	adafruit/Adafruit INA237 and INA238 Library
	pololu/ACS37800@^1.0.0
	kosme/arduinoFFT@^2.0.4
	https://github.com/jhyland87/Adafruit_LSM6DS.git
	sparkfun/SparkFun Qwiic Relay Arduino Library@^1.3.1
	sparkfun/SparkFun ADS122C04 ADC Arduino Library@^1.0.4
	nanopb/Nanopb@^0.4.9
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
extra_scripts =
	pre:scripts/compile_proto.py
	pre:scripts/build_dashboard.py
	pre:scripts/embed_web.py
lib_ignore =
	ESPAsyncTCP
	RPAsyncTCP
	AsyncTCP_RP2040W
test_framework = unity
test_filter = test_embedded
test_build_src = no
test_ignore = test_native, test_conversions
monitor_speed = 115200
monitor_port = /dev/cu.usbmodem11101
upload_speed = 921600
build_unflags =
	-std=gnu++11
build_flags =
	-DCORE_DEBUG_LEVEL=1
	-DARDUINO_LOOP_STACK_SIZE=16384
	-O2
	-I include
	-I include/config
	-I include/modules
	-I include/generated
	-std=gnu++17

[env:native]
build_unflags =
	-std=gnu++11
build_flags =
	-std=gnu++17
	-DUNITY_INCLUDE_CONFIG_H
	-I test/test_native/stubs
	-I include
	-I include/config
	-I include/modules
	-I include/generated
	-I lib/arduino-fsm
platform = native
test_filter = test_native, test_conversions
lib_compat_mode = off
lib_ignore =
	Adafruit BusIO
	Adafruit INA237 and INA238 Library
	Adafruit LSM6DS
	Adafruit Unified Sensor
	SparkFun Qwiic Relay Arduino Library
	SparkFun ADS122C04 ADC Arduino Library
lib_deps =
	bblanchon/ArduinoJson@^7.4.2
	jonblack/arduino-fsm@^2.2.0

[env:esp32s3_test]
extends = env:esp32s3
extra_scripts =
test_filter = test_embedded
test_build_src = no
test_ignore = test_native, test_conversions
lib_deps =
	majicdesigns/MD_AD9833@^1.3.0
	sparkfun/SparkFun ADS122C04 ADC Arduino Library@^1.0.4
